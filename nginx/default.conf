# ====== nginx/default.conf ======
upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # برای آپلود فایل Gerber و رسید

    # فایل‌های static (CSS, JS, فونت، bootstrap, jquery)
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    # فایل‌های media (آپلودها)
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # بقیه درخواست‌ها → Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}