{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}سایت{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{% static 'vendor/css/bootstrap.css' %}" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="{% static 'vendor/css/bootstrap-icons.min.css' %}" />
  <!-- استایل‌های پروژه -->
  <link rel="stylesheet" href="{% static 'css/globals.css' %}" />
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}" />
  <link rel="stylesheet" href="{% static 'css/forms.css' %}" />
  <link rel="stylesheet" href="{% static 'css/footer.css' %}" />

  {% block extra_css %}{% endblock %}

  <!-- jQuery — باید قبل از همه JS دیگه باشه -->
  <script src="{% static 'vendor/js/jquery.min.js' %}"></script>
</head>

<body>

  <!-- Navbar -->
  {% include "components/navbar.html" %}

  <!-- Slider (فقط صفحاتی که block رو override می‌کنن نمایش داده می‌شه) -->
  {% block slider %}{% endblock %}

  <!-- محتوای اصلی -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include "components/footer.html" %}

  <!-- Bootstrap JS Bundle (شامل Popper) -->
  <script src="{% static 'vendor/js/bootstrap.bundle.min.js' %}"></script>
{#  <script src="{% static 'vendor/js/poper_1.16.1.js' %}"></script>#}

  <!-- ─── JS Library های پروژه ─────────────────── -->
  <script src="{% static 'js/lib/api.js' %}"></script>
  <script src="{% static 'js/lib/token.js' %}"></script>
  <script src="{% static 'js/lib/auth.js' %}"></script>
  <script src="{% static 'js/lib/utils.js' %}"></script>

  <!-- Navbar JS (بعد از lib ها) -->
  <script src="{% static 'js/components/navbar.js' %}"></script>

  <!-- JS اختصاصی هر صفحه -->
  {% block extra_js %}{% endblock %}

</body>
</html>
