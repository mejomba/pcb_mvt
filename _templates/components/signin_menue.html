<!-- لینک CSS بوت‌استرپ آیکن‌ها را فراموش نکن -->
{#<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">#}

<!-- منوی کشویی -->
<div class="dropdown user-menu d-inline-block">
  <!-- دکمه منو - محتوایش با jQuery تعویض می‌شود -->
  <button class="btn btn-link text-dark dropdown-toggle p-0" type="button" id="userMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
    <!-- متن دکمه توسط jQuery تنظیم می‌شود -->
  </button>

  <!-- محتوای کشویی -->
  <div class="dropdown-menu dropdown-menu-right p-0" style="min-width: 15rem;">
    <!-- بخش لاگین (پیش‌فرض) -->
    <div id="guest-menu" class="p-3">
      <a href="{% url "auth:template_auth_otp" %}" class="btn btn-primary btn-block rounded-pill">Sign in</a>
      <p class="small text-muted mt-2 mb-0">
        New Customer? <a href="{% url "auth:template_auth_otp" %}" class="text-primary">Start Here</a>
      </p>
      <hr>
      <div class="position-relative">
        <!-- overlay غیرفعال -->
        <div class="position-absolute w-100 h-100 bg-white" style="opacity: 0.6; z-index: 1;"></div>
        <ul class="list-unstyled mb-0" style="opacity: 0.4;">
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-clipboard-check mr-2"></i> Order history
          </li>
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-folder mr-2"></i> My Projects
          </li>
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-gear mr-2"></i> Parts Manager
          </li>
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-envelope mr-2"></i> My Messages
          </li>
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-ticket mr-2"></i> My Coupons
          </li>
          <li class="dropdown-item disabled d-flex align-items-center">
            <i class="bi bi-person mr-2"></i> My Account
          </li>
        </ul>
      </div>
    </div>

    <!-- بخش کاربر لاگین‌شده -->
    <div id="user-menu" class="p-3" style="display: none;">
      <button id="logout-btn" class="btn btn-danger btn-block rounded-pill">Logout</button>
      <ul class="list-unstyled mt-3 mb-0 small">
        <li><a href="{% url 'aaa:profile' %}" class="dropdown-item d-flex align-items-center"><i class="bi bi-clipboard-check mr-2"></i> Order history</a></li>
        <li><a href="/projects" class="dropdown-item d-flex align-items-center"><i class="bi bi-folder mr-2"></i> My Projects</a></li>
        <li><a style="opacity: 0.6" href="/parts" class="dropdown-item d-flex align-items-center"><i class="bi bi-gear mr-2"></i> Parts Manager</a></li>
        <li><a href="/messages" class="dropdown-item d-flex align-items-center"><i class="bi bi-envelope mr-2"></i> My Messages</a></li>
        <li><a href="/coupons" class="dropdown-item d-flex align-items-center"><i class="bi bi-ticket mr-2"></i> My Coupons</a></li>
        <li><a href="/api/v1/auth/template/profile/" class="dropdown-item d-flex align-items-center"><i class="bi bi-person mr-2"></i> My Account</a></li>
      </ul>
    </div>
  </div>
</div>
