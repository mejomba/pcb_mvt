{% if error %}
<div class="alert alert-danger text-right p-3 mb-3" id="login-error-box">
  {{ error }}
</div>
{% else %}
<div class="alert alert-danger text-right p-3 mb-3" id="login-error-box" style="display: none;"></div>
{% endif %}

<form id="password-login-form" method="post" action="#" class="mt-4"
      data-ajax-login-url="{% url 'aaa:password-login-or-signup' %}">
  {% csrf_token %}
  <div class="form-group">
    <label for="phone" class="text-right d-block">شماره موبایل</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      dir="rtl"
      class="form-control text-right {% if error %}is-invalid{% endif %}"
      placeholder="۰۹۱۲۳۴۵۶۷۸۹"
      value="{{ phone }}"
      required
    >
  </div>
  <div class="form-group">
    <label for="password" class="text-right d-block">رمز عبور</label>
    <input
      type="password"
      id="password"
      name="password"
      dir="rtl"
      class="form-control text-right {% if error %}is-invalid{% endif %}"
      placeholder="••••••••"
      required
    >
  </div>
  <button type="submit" class="btn btn-primary btn-block font-weight-bold" id="login-submit-btn">
    ورود
  </button>
</form>

<p class="text-right mt-3">
  حساب کاربری ندارید؟
  <a href="{% url 'aaa:template_auth_otp' %}" class="text-success mr-2">ایجاد حساب کاربری</a>
</p>

<script>
$(document).ready(function() {
  var $form = $('#password-login-form');
  var $errorBox = $('#login-error-box');
  var $btn = $('#login-submit-btn');
  var csrfToken = $form.find('input[name=csrfmiddlewaretoken]').val();

  $form.on('submit', function(e) {
    e.preventDefault();

    var phoneNumber = $('#phone').val().trim();
    var password = $('#password').val();

    // اعتبارسنجی سمت کلاینت
    if (!phoneNumber) {
      $errorBox.text('شماره موبایل الزامی است.').show();
      $('#phone').focus();
      return;
    }
    if (!password) {
      $errorBox.text('رمز عبور الزامی است.').show();
      $('#password').focus();
      return;
    }

    // غیرفعال کردن دکمه و نمایش اسپینر
    $btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm ml-1" role="status" aria-hidden="true"></span> در حال ورود...');

    $.ajax({
      url: $form.data('ajax-login-url'),
      method: 'POST',
      data: {
        phone: phoneNumber,
        password: password
      },
      headers: {
        'X-CSRFToken': csrfToken
      },
      success: function(response) {
        // ورود موفق - هدایت به صفحه مقصد
        document.cookie = `access=${response.access}; path=/; max-age=604800`;
        document.cookie = `refresh=${response.refresh}; path=/; max-age=604800`;
        var redirectUrl = response.redirect || '/';
        window.location.href = redirectUrl;
      },
      error: function(jqXHR) {
        var errMsg = 'اطلاعات وارد شده صحیح نیست.';
        if (jqXHR.responseJSON && jqXHR.responseJSON.error) {
          errMsg = jqXHR.responseJSON.error;
        } else if (jqXHR.status === 429) {
          errMsg = 'تعداد تلاش‌های ناموفق زیاد است. لطفاً کمی صبر کنید.';
        } else if (jqXHR.status === 401) {
          errMsg = 'شماره موبایل یا رمز عبور اشتباه است.';
        } else if (jqXHR.status === 400) {
          errMsg = 'شماره موبایل یا رمز عبور اشتباه است.';
        }
        $errorBox.text(errMsg).show();
        // فعال‌سازی مجدد دکمه
        $btn.prop('disabled', false).text('ورود');
      }
    });
  });
});
</script>
